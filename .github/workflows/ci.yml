name: test-and-lint
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          # The upgrade test rebuilds the previous release from history.
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: '8.3'
          tools: none
          coverage: none
      - name: Run offline behavior tests
        run: php -n tests/run.php
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            php -n -l "$source"
          done < <(find extension tests -type f -name '*.php' -print0)
  native-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: '8.4.27'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sqlite3, zip
          tools: composer:v2
          coverage: none
      - name: Provision pinned public Paymenter 1.5.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://codeload.github.com/Paymenter/Paymenter/tar.gz/ee729f7d99ac18942625b79f3f93d8d8b21255e8 -o "$RUNNER_TEMP/paymenter.tar.gz"
          echo "0b8e6c9f3b9c28aa69ee4c2978ec544814a70edb3e96a4ae3bc150a0acee6c1c  $RUNNER_TEMP/paymenter.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/paymenter"
          tar -xzf "$RUNNER_TEMP/paymenter.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/paymenter"
          composer install --working-dir="$RUNNER_TEMP/paymenter" --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Run isolated native pending integration (public default theme)
        env:
          PAYMENTER_TEST_APP: ${{ runner.temp }}/paymenter
          PAY_PENDING_MATRIX: '1'
          TMPDIR: ${{ runner.temp }}
        run: php -d memory_limit=256M tests/run.php
