name: test-and-lint
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          # The upgrade test rebuilds the previous release from history.
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: '8.3'
          tools: none
          coverage: none
      - name: Run offline behavior tests
        env:
          PAY_TEST_ENTERED: ${{ runner.temp }}/entered/offline.txt
        run: php -n tests/run.php
      - name: Keep the loaded test file list for the coverage job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: entered-offline
          path: ${{ runner.temp }}/entered/offline.txt
          if-no-files-found: error
          retention-days: 1
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            php -n -l "$source"
          done < <(find extension tests -type f -name '*.php' -print0)
  native-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: '8.4.27'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sqlite3, zip
          tools: composer:v2
          coverage: none
      - name: Provision pinned public Paymenter 1.5.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://codeload.github.com/Paymenter/Paymenter/tar.gz/ee729f7d99ac18942625b79f3f93d8d8b21255e8 -o "$RUNNER_TEMP/paymenter.tar.gz"
          echo "0b8e6c9f3b9c28aa69ee4c2978ec544814a70edb3e96a4ae3bc150a0acee6c1c  $RUNNER_TEMP/paymenter.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/paymenter"
          tar -xzf "$RUNNER_TEMP/paymenter.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/paymenter"
          composer install --working-dir="$RUNNER_TEMP/paymenter" --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Run isolated native pending integration (public default theme)
        env:
          PAYMENTER_TEST_APP: ${{ runner.temp }}/paymenter
          PAY_PENDING_MATRIX: '1'
          PAY_TEST_ENTERED: ${{ runner.temp }}/entered/native.txt
          TMPDIR: ${{ runner.temp }}
        run: php -d memory_limit=256M tests/run.php
      - name: Keep the loaded test file list for the coverage job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: entered-native
          path: ${{ runner.temp }}/entered/native.txt
          if-no-files-found: error
          retention-days: 1
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: '8.4.27'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sqlite3, zip
          tools: composer:v2
          coverage: none
      - name: Provision pinned public Paymenter 1.5.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://codeload.github.com/Paymenter/Paymenter/tar.gz/ee729f7d99ac18942625b79f3f93d8d8b21255e8 -o "$RUNNER_TEMP/paymenter.tar.gz"
          echo "0b8e6c9f3b9c28aa69ee4c2978ec544814a70edb3e96a4ae3bc150a0acee6c1c  $RUNNER_TEMP/paymenter.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/paymenter"
          tar -xzf "$RUNNER_TEMP/paymenter.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/paymenter"
          composer install --working-dir="$RUNNER_TEMP/paymenter" --no-interaction --prefer-dist --no-progress --no-scripts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Install pinned Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/stripe-browser" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/stripe-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run browser checks (payment errors, setup modal, notice polling)
        env:
          PAYMENTER_TEST_APP: ${{ runner.temp }}/paymenter
          PAY_PENDING_MATRIX: browser
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/stripe-browser/node_modules/playwright
          PAY_TEST_ENTERED: ${{ runner.temp }}/entered/browser.txt
          TMPDIR: ${{ runner.temp }}
        run: php -d memory_limit=256M tests/run.php
      - name: Keep the loaded test file list for the coverage job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: entered-browser
          path: ${{ runner.temp }}/entered/browser.txt
          if-no-files-found: error
          retention-days: 1
  coverage:
    # Fails when a test file was named but never loaded by any job above.
    needs: [php, native-pending, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: '8.3'
          tools: none
          coverage: none
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: entered-*
          merge-multiple: true
          path: ${{ runner.temp }}/entered
      - name: Require every test file to be loaded by a CI job
        run: php -n tests/ci-coverage.php "$RUNNER_TEMP/entered"
