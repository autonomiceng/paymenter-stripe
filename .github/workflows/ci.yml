name: test-and-lint
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          # The upgrade test rebuilds the previous release from history.
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: '8.3'
          tools: none
          coverage: none
      - name: Run offline behavior tests
        run: php -n tests/run.php
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            php -n -l "$source"
          done < <(find extension tests -type f -name '*.php' -print0)
